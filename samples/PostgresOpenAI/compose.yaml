name: mem0sharp

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: mem0
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mem0"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - mem0sharp-postgres:/var/lib/postgresql/data

volumes:
  mem0sharp-postgres:
