name: Publish Mem0Sharp NuGet packages

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write
  id-token: write

env:
  DOTNET_VERSION: '10.0.x'
  PACKAGE_SOURCE: https://nuget.pkg.github.com/jihadkhawaja/index.json
  NUGET_SOURCE: https://api.nuget.org/v3/index.json

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore Mem0Sharp.slnx

      - name: Build
        run: dotnet build Mem0Sharp.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/Mem0Sharp.Tests/Mem0Sharp.Tests.csproj --configuration Release --no-restore

      - name: Validate release version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $GITHUB_REF_NAME. Expected vMAJOR.MINOR.PATCH or a SemVer prerelease." >&2
            exit 1
          fi

      - name: Pack
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          for project in \
            src/Mem0Sharp/Mem0Sharp.csproj \
            src/Mem0Sharp.PostgreSQL/Mem0Sharp.PostgreSQL.csproj \
            src/Mem0Sharp.SQLite/Mem0Sharp.SQLite.csproj; do
            dotnet pack "$project" \
              --configuration Release \
              --no-build \
              --output ./artifacts/package \
              -p:Version="$version" \
              -p:PackageVersion="$version"
          done

      - name: Verify package versions
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          for package in artifacts/package/*.nupkg; do
            nuspec="$(unzip -p "$package" '*.nuspec' | tr -d '\r')"
            if ! grep -q "<version>$version</version>" <<< "$nuspec"; then
              echo "Package $package does not have version $version" >&2
              exit 1
            fi
          done

      - name: Publish to GitHub Packages
        run: dotnet nuget push ./artifacts/package/*.nupkg --source "$PACKAGE_SOURCE" --api-key "${{ secrets.GITHUB_TOKEN }}" --skip-duplicate

      - name: Authenticate to NuGet.org with trusted publishing
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: jihadkhawaja

      - name: Publish to NuGet.org
        run: dotnet nuget push ./artifacts/package/*.nupkg --source "$NUGET_SOURCE" --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --skip-duplicate
